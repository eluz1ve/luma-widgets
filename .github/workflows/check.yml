name: Check widgets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The lg-luma commit whose luma-widget checks the catalog; Luma releases bump it.
  LUMA_REV: cd80a5b4f6aa65b117851a2adc4b2a9ed64082d5

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/luma-widget
          key: luma-widget-${{ env.LUMA_REV }}
      - name: Install luma-widget
        run: |
          command -v luma-widget ||
            cargo install --locked --git https://github.com/eluz1ve/lg-luma --rev "$LUMA_REV" luma-widgets
      - name: Check and test every widget
        run: |
          for widget in widgets/*/; do
            luma-widget check "$widget"
            luma-widget test "$widget"
          done
      - name: Pack
        run: luma-widget pack widgets out --sequence 1
